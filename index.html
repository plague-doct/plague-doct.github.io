<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScareFactory — Horror Film Scare Factor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-overlay"></div>

  <header>
    <div class="logo">
      <span class="skull">☠</span>
      <h1>ScareFactory</h1>
    </div>
    <p class="tagline">How scary is it, really?</p>
  </header>

  <main>
    <section class="search-section">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search for a horror film..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="searchBtn">Search</button>
      </div>
      <div id="suggestions" class="suggestions hidden"></div>
    </section>

    <section id="resultsSection" class="results-section hidden">
      <div id="results" class="results-grid"></div>
    </section>

    <section id="movieDetail" class="movie-detail hidden">
      <button class="back-btn" id="backBtn">← Back to results</button>
      <div id="detailContent"></div>
    </section>

    <section class="trending-section" id="trendingSection">
      <h2>Trending Horror</h2>
      <div id="trendingGrid" class="results-grid"></div>
    </section>
  </main>

  <footer>
    <p>Data provided by <a href="https://www.themoviedb.org" target="_blank">TMDB</a>. Scare scores are calculated, not official ratings.</p>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
