<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScareFactory — Horror Film Scare Factor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-overlay"></div>

  <header>
    <div class="logo">
      <span class="skull">☠</span>
      <h1>ScareFactory</h1>
    </div>
  </header>

  <main>

    <!-- ── Home ── -->
    <section id="homeSection" class="home-section">
      <div class="home-search-wrap">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search a horror film..." autocomplete="off" spellcheck="false" />
          <button id="searchBtn">Search</button>
        </div>
        <div id="suggestions" class="suggestions hidden"></div>
        <p class="hunt-tagline">hunt if you dare</p>
        <button class="compare-launch-btn" id="compareLaunchBtn">⚔ Compare Films</button>
      </div>
    </section>

    <!-- ── Search Results ── -->
    <section id="resultsSection" class="results-section hidden">
      <div class="section-header">
        <button class="back-btn" id="resultsBackBtn">← Back</button>
        <h2 class="section-title" id="resultsTitle">Results</h2>
      </div>
      <div id="results" class="results-grid"></div>
    </section>

    <!-- ── Movie Detail ── -->
    <section id="movieDetail" class="movie-detail hidden">
      <button class="back-btn" id="backBtn">← Back</button>
      <div id="detailContent"></div>
    </section>

    <!-- ── Compare ── -->
    <section id="compareSection" class="compare-section hidden">
      <div class="section-header">
        <button class="back-btn" id="compareBackBtn">← Back</button>
        <h2 class="section-title">Compare Films</h2>
      </div>

      <div class="compare-search-row">
        <div class="compare-search-wrap">
          <input type="text" id="compareSearchInput" placeholder="Add a film to compare..." autocomplete="off" spellcheck="false" />
          <button id="compareSearchBtn">Add</button>
        </div>
        <div id="compareSuggestions" class="suggestions hidden"></div>
      </div>

      <div id="compareSlots" class="compare-slots">
        <div class="compare-empty-hint">Search above to add films — up to 4 at once</div>
      </div>

      <div id="compareChart" class="compare-chart hidden"></div>
    </section>

  </main>

  <footer>
    <p>Data by <a href="https://www.themoviedb.org" target="_blank">TMDB</a>. Scare scores are calculated, not official ratings.</p>
  </footer>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
